name: build-command-plugins

on:
  push:
    branches:
      - "**"
    paths:
      - "examples/plugins/*-zig/**"
      - "examples/plugins/*-c/**"
      - ".github/workflows/build-command-plugins.yml"
  pull_request:
    paths:
      - "examples/plugins/*-zig/**"
      - "examples/plugins/*-c/**"
      - ".github/workflows/build-command-plugins.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-command-plugins:
    name: Build command plugins ${{ matrix.target_name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # linux-gnu (glibc, dynamically linked — standard Linux servers)
          - target_name: linux-amd64
            zig_target: x86_64-linux-gnu
            ext: ""
            needs_advapi32: "false"
          - target_name: linux-arm64
            zig_target: aarch64-linux-gnu
            ext: ""
            needs_advapi32: "false"
          - target_name: linux-386
            zig_target: x86-linux-gnu
            ext: ""
            needs_advapi32: "false"
          - target_name: linux-arm
            zig_target: arm-linux-gnueabihf
            ext: ""
            needs_advapi32: "false"
          - target_name: linux-mipsel
            zig_target: mipsel-linux-gnueabi
            ext: ""
            needs_advapi32: "false"
          - target_name: linux-mips64el
            zig_target: mips64el-linux-gnuabi64
            ext: ""
            needs_advapi32: "false"
          - target_name: linux-loong64
            zig_target: loongarch64-linux-gnu
            ext: ""
            needs_advapi32: "false"
          # android (musl, fully static — for Termux on Android)
          # Zig 0.16 does not ship bionic; static musl binaries run natively on
          # Termux without any runtime libc dependency.
          - target_name: android-arm64
            zig_target: aarch64-linux-musl
            ext: ""
            needs_advapi32: "false"
          - target_name: android-arm
            zig_target: arm-linux-musleabihf
            ext: ""
            needs_advapi32: "false"
          - target_name: android-amd64
            zig_target: x86_64-linux-musl
            ext: ""
            needs_advapi32: "false"
          # darwin (macOS)
          - target_name: darwin-amd64
            zig_target: x86_64-macos
            ext: ""
            needs_advapi32: "false"
          - target_name: darwin-arm64
            zig_target: aarch64-macos
            ext: ""
            needs_advapi32: "false"
          # windows (MinGW, advapi32 for registry API in systemspec-c)
          - target_name: windows-amd64
            zig_target: x86_64-windows-gnu
            ext: .exe
            needs_advapi32: "true"
          - target_name: windows-arm64
            zig_target: aarch64-windows-gnu
            ext: .exe
            needs_advapi32: "true"
          - target_name: windows-386
            zig_target: x86-windows-gnu
            ext: .exe
            needs_advapi32: "true"
          # freebsd (FreeBSD 15.0 libc shipped by Zig 0.16)
          - target_name: freebsd-amd64
            zig_target: x86_64-freebsd
            ext: ""
            needs_advapi32: "false"
          - target_name: freebsd-arm64
            zig_target: aarch64-freebsd
            ext: ""
            needs_advapi32: "false"
          - target_name: freebsd-386
            zig_target: x86-freebsd
            ext: ""
            needs_advapi32: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Build Zig/C command plugin binaries
        run: |
          set -euo pipefail

          out_root="dist/command-plugins/${{ matrix.target_name }}"
          mkdir -p "$out_root/clank-o-meter-zig" "$out_root/datetime-zig" "$out_root/systemspec-c"

          cp ./examples/plugins/clank-o-meter-zig/plugin.json "$out_root/clank-o-meter-zig/plugin.json"
          cp ./examples/plugins/datetime-zig/plugin.json "$out_root/datetime-zig/plugin.json"
          cp ./examples/plugins/systemspec-c/plugin.json "$out_root/systemspec-c/plugin.json"

          zig build-exe ./examples/plugins/clank-o-meter-zig/main.zig \
            -O ReleaseSmall \
            -fstrip \
            -target ${{ matrix.zig_target }} \
            -femit-bin="$out_root/clank-o-meter-zig/clank-o-meter-zig${{ matrix.ext }}"

          zig build-exe ./examples/plugins/datetime-zig/main.zig \
            -O ReleaseSmall \
            -fstrip \
            -target ${{ matrix.zig_target }} \
            -femit-bin="$out_root/datetime-zig/datetime-zig${{ matrix.ext }}"

          if [ "${{ matrix.needs_advapi32 }}" = "true" ]; then
            zig cc -O2 -s -target ${{ matrix.zig_target }} \
              -o "$out_root/systemspec-c/systemspec-c${{ matrix.ext }}" \
              ./examples/plugins/systemspec-c/main.c \
              -ladvapi32
          else
            zig cc -O2 -s -target ${{ matrix.zig_target }} \
              -o "$out_root/systemspec-c/systemspec-c${{ matrix.ext }}" \
              ./examples/plugins/systemspec-c/main.c
          fi

      - name: Upload command plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: command-plugins-${{ matrix.target_name }}
          path: dist/command-plugins/${{ matrix.target_name }}
          if-no-files-found: error