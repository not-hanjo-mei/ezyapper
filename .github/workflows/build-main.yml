name: build-main

on:
  push:
    branches:
      - "**"
    paths:
      - "cmd/bot/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/build-main.yml"
  pull_request:
    paths:
      - "cmd/bot/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/build-main.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # linux (7 archs)
          - goos: linux
            goarch: amd64
            goarm: ""
            artifact_name: ezyapper-linux-amd64
            binary_name: ezyapper-linux-amd64
          - goos: linux
            goarch: arm64
            goarm: ""
            artifact_name: ezyapper-linux-arm64
            binary_name: ezyapper-linux-arm64
          - goos: linux
            goarch: "386"
            goarm: ""
            artifact_name: ezyapper-linux-386
            binary_name: ezyapper-linux-386
          - goos: linux
            goarch: arm
            goarm: "7"
            artifact_name: ezyapper-linux-arm
            binary_name: ezyapper-linux-arm
          - goos: linux
            goarch: mipsle
            goarm: ""
            artifact_name: ezyapper-linux-mipsle
            binary_name: ezyapper-linux-mipsle
          - goos: linux
            goarch: mips64le
            goarm: ""
            artifact_name: ezyapper-linux-mips64le
            binary_name: ezyapper-linux-mips64le
          - goos: linux
            goarch: loong64
            goarm: ""
            artifact_name: ezyapper-linux-loong64
            binary_name: ezyapper-linux-loong64
          # darwin (2 archs)
          - goos: darwin
            goarch: amd64
            goarm: ""
            artifact_name: ezyapper-darwin-amd64
            binary_name: ezyapper-darwin-amd64
          - goos: darwin
            goarch: arm64
            goarm: ""
            artifact_name: ezyapper-darwin-arm64
            binary_name: ezyapper-darwin-arm64
          # windows (3 archs)
          - goos: windows
            goarch: amd64
            goarm: ""
            artifact_name: ezyapper-windows-amd64
            binary_name: ezyapper-windows-amd64.exe
          - goos: windows
            goarch: arm64
            goarm: ""
            artifact_name: ezyapper-windows-arm64
            binary_name: ezyapper-windows-arm64.exe
          - goos: windows
            goarch: "386"
            goarm: ""
            artifact_name: ezyapper-windows-386
            binary_name: ezyapper-windows-386.exe
          # freebsd (3 archs)
          - goos: freebsd
            goarch: amd64
            goarm: ""
            artifact_name: ezyapper-freebsd-amd64
            binary_name: ezyapper-freebsd-amd64
          - goos: freebsd
            goarch: arm64
            goarm: ""
            artifact_name: ezyapper-freebsd-arm64
            binary_name: ezyapper-freebsd-arm64
          - goos: freebsd
            goarch: "386"
            goarm: ""
            artifact_name: ezyapper-freebsd-386
            binary_name: ezyapper-freebsd-386
          # android (arm64 + armv7 — for Termux). arm64 is a static pure-Go
          # binary. Go only supports android/arm with external (cgo) linking,
          # so armv7 is linked with the Android NDK clang preinstalled on
          # GitHub's ubuntu runners (API 21 = Android 5.0, Go's minimum).
          - goos: android
            goarch: arm64
            goarm: ""
            artifact_name: ezyapper-android-arm64
            binary_name: ezyapper-android-arm64
          - goos: android
            goarch: arm
            goarm: "7"
            artifact_name: ezyapper-android-arm
            binary_name: ezyapper-android-arm
            ndk_cc: armv7a-linux-androideabi21-clang

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          NDK_CC: ${{ matrix.ndk_cc }}
        run: |
          if [ -n "$NDK_CC" ]; then
            ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
            if [ -z "$ndk" ] || [ ! -d "$ndk" ]; then
              echo "Android NDK not found on runner (ANDROID_NDK_LATEST_HOME unset)" >&2
              exit 1
            fi
            export CGO_ENABLED=1
            export CC="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/$NDK_CC"
            "$CC" --version
          fi
          go build -trimpath -o "${{ matrix.binary_name }}" ./cmd/bot
          file "${{ matrix.binary_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.binary_name }}
          if-no-files-found: error